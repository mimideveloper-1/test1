    <script>
    /* =========================================================
       AUTOMATIC CALCULATOR.NET META SYSTEM
       ========================================================= */

    (function () {
        const url = new URL(window.location.href);
        const origin = url.origin;
        const pathname = url.pathname;
        const fullURL = origin + pathname;

        const siteName = "Calculator.net";

        let pageName =
            pathname
                .split("/")
                .filter(Boolean)
                .pop() || "index.html";

        pageName = pageName
            .replace(/\.(html?|php|asp|aspx)$/i, "")
            .replace(/[-_]+/g, " ")
            .trim();

        function titleCase(text) {
            return text
                .split(" ")
                .map(word =>
                    word.charAt(0).toUpperCase() +
                    word.slice(1).toLowerCase()
                )
                .join(" ");
        }

        let formattedPage = titleCase(pageName);

        const pageNames = {
            "index": "Calculator",
            "home": "Calculator",
            "g": "Math Calculator",
            "algebra": "Algebra Calculator",
            "percentage": "Percentage Calculator",
            "percent": "Percentage Calculator",
            "scientific": "Scientific Calculator",
            "fraction": "Fraction Calculator",
            "finance": "Financial Calculator",
            "loan": "Loan Calculator",
            "mortgage": "Mortgage Calculator",
            "age": "Age Calculator",
            "date": "Date Calculator",
            "time": "Time Calculator",
            "conversion": "Conversion Calculator",
            "unit": "Unit Converter",
            "settings": "Settings"
        };

        if (pageNames[pageName.toLowerCase()]) {
            formattedPage = pageNames[pageName.toLowerCase()];
        }

        const title =
            formattedPage === "Calculator"
                ? "Calculator.net — Free Online Calculators"
                : `${formattedPage} — Calculator.net`;

        let description;

        if (formattedPage === "Calculator") {
            description =
                "Free online calculators for math, algebra, percentages, finance, conversions, and everyday calculations.";
        } else {
            description =
                `Free ${formattedPage.toLowerCase()} with fast, accurate results and easy-to-use calculation tools.`;
        }

        document.title = title;

        function setMeta(attribute, value, content) {
            let element =
                document.querySelector(
                    `meta[${attribute}="${value}"]`
                );

            if (!element) {
                element = document.createElement("meta");
                element.setAttribute(attribute, value);
                document.head.appendChild(element);
            }

            element.setAttribute("content", content);
        }

        function setLink(rel, href) {
            let element =
                document.querySelector(
                    `link[rel="${rel}"]`
                );

            if (!element) {
                element = document.createElement("link");
                element.rel = rel;
                document.head.appendChild(element);
            }

            element.href = href;
        }

        setMeta("name", "title", title);
        setMeta("name", "description", description);
        setMeta("name", "author", "Calculator.net");
        setMeta("name", "robots", "index, follow");
        setMeta("name", "language", "English");
        setMeta("name", "rating", "General");
        setMeta("name", "theme-color", "#111827");

        setMeta(
            "name",
            "keywords",
            `${formattedPage}, calculator, online calculator, free calculator, Calculator.net`
        );

        setMeta("property", "og:type", "website");
        setMeta("property", "og:title", title);
        setMeta("property", "og:description", description);
        setMeta("property", "og:url", fullURL);
        setMeta("property", "og:site_name", siteName);
        setMeta("property", "og:locale", "en_US");
        setMeta("property", "og:image", origin + "/og-share.png");
        setMeta("property", "og:image:width", "1200");
        setMeta("property", "og:image:height", "630");

        setMeta(
            "name",
            "twitter:card",
            "summary_large_image"
        );

        setMeta("name", "twitter:url", fullURL);
        setMeta("name", "twitter:title", title);
        setMeta("name", "twitter:description", description);
        setMeta("name", "twitter:image", origin + "/og-share.png");
        setMeta("name", "twitter:image:alt", title);

        setLink("canonical", fullURL);

        setMeta(
            "name",
            "application-name",
            siteName
        );

        setMeta(
            "name",
            "apple-mobile-web-app-title",
            siteName
        );
    })();
    </script>

    <script>

    /* =========================================================
       PAGE SYSTEM
       ========================================================= */

    const pageFrame =
        document.getElementById("pageFrame");

    const homeOverlay =
        document.getElementById("homeOverlay");


    function switchPage(page) {

        if (!page) return;

        /*
         * HOME
         *
         * Don't load home.html into itself.
         */

        if (
            page === "home.html" ||
            page === "home"
        ) {

            pageFrame.src =
                "about:blank";

            pageFrame.style.display =
                "none";

            homeOverlay.style.display =
                "flex";

            return;
        }


        /*
         * OPEN REQUESTED PAGE
         */

        homeOverlay.style.display =
            "none";

        pageFrame.style.display =
            "block";

        pageFrame.src =
            page;
    }


    /* =========================================================

       EXACTLY MATCHES SETTINGS.HTML
       ========================================================= */

    const themes = {

        },

        },

        emerald: {

            bg1: "#00140e",
            bg2: "#006b43"
        }
    };


    /* =========================================================
       APPLY SAVED THEME
       ========================================================= */

    function applyTheme() {

        let themeName =
            localStorage.getItem("selectedTheme");

        if (
            !themeName ||
            !themes[themeName]
        ) {
            themeName = "default";
        }

        const theme =
            themes[themeName];

        document.documentElement.style
            .setProperty(
                "--accent1",
                theme.accent1
            );

        document.documentElement.style
            .setProperty(
                "--accent2",
                theme.accent2
            );

        document.documentElement.style
            .setProperty(
                "--theme-bg1",
                theme.bg1
            );

        document.documentElement.style
            .setProperty(
                "--theme-bg2",
                theme.bg2
            );


        /*
         * Update the meta theme color too.
         */

        const metaTheme =
            document.querySelector(
                'meta[name="theme-color"]'
            );

        if (metaTheme) {
            metaTheme.content =
                theme.bg1;
        }


        /*
         * Apply the selected theme gradient
         * only when no custom background is active.
         */

        const bgType =
            localStorage.getItem("bgType");

        if (
            !bgType ||
            bgType === "none"
        ) {

            const bg =
                document.getElementById("bg");

            if (bg) {

                bg.style.background =
                    `linear-gradient(
                        135deg,
                        ${theme.bg1},
                        ${theme.bg2}
                    )`;
            }
        }
    }


    /* =========================================================
       BACKGROUND SYSTEM
       SAME STORAGE KEYS AS SETTINGS.HTML
       ========================================================= */

    function setBackground(type, value = "") {

        localStorage.setItem(
            "bgType",
            type
        );

        localStorage.setItem(
            "bgValue",
            value
        );

        /*
         * Keep activeBackground for compatibility.
         */

        if (type === "color") {

            localStorage.setItem(
                "activeBackground",
                value
            );

        } else if (type === "none") {

            localStorage.setItem(
                "activeBackground",
                "none"
            );

        } else {

            localStorage.setItem(
                "activeBackground",
                value || type
            );
        }

        applyBackground();
    }


    /* =========================================================
       APPLY BACKGROUND
       ========================================================= */

    function applyBackground() {

        const bg =
            document.getElementById("bg");

        if (!bg) return;


        /*
         * Get the saved settings.
         */

        let type =
            localStorage.getItem("bgType");

        let value =
            localStorage.getItem("bgValue");


        /*
         * IMPORTANT:
         *
         * If the user has never selected
         * a background before, use OMORILAB.
         *
         * This does NOT overwrite an existing
         * "none", image, video, or color choice.
         */

        if (!type) {

            type = "video";

            value =
                "/background-imgs/OMORILAB ORIGINAL ANIMATION MEME 3333.mp4";

            localStorage.setItem(
                "bgType",
                type
            );

            localStorage.setItem(
                "bgValue",
                value
            );

            localStorage.setItem(
                "activeBackground",
                value
            );
        }


        if (value === null) {
            value = "";
        }


        /*
         * Get current theme.
         */

        let themeName =
            localStorage.getItem(
                "selectedTheme"
            );

        if (
            !themeName ||
            !themes[themeName]
        ) {
            themeName = "default";
        }

        const theme =
            themes[themeName];


        /*
         * Remove old video.
         */

        const oldVideo =
            bg.querySelector(
                ".background-video"
            );

        if (oldVideo) {

            oldVideo.pause();
            oldVideo.remove();
        }


        /*
         * Reset styles.
         */

        bg.style.backgroundImage =
            "none";

        bg.style.backgroundColor =
            "transparent";

        bg.style.background =
            "transparent";


        /* =====================================================
           NONE
           ===================================================== */

        if (type === "none") {

            /*
             * None means:
             *
             * NO IMAGE
             * NO VIDEO
             * NO OMORILAB
             *
             * The selected theme gradient remains.
             */

            bg.style.background =
                `linear-gradient(
                    135deg,
                    ${theme.bg1},
                    ${theme.bg2}
                )`;

            return;
        }


        /* =====================================================
           COLOR
           ===================================================== */

        if (type === "color") {

            if (
                value &&
                value.trim() !== ""
            ) {

                bg.style.background =
                    value;

            } else {

                bg.style.background =
                    "#000000";
            }

            return;
        }


        /* =====================================================
           IMAGE
           ===================================================== */

        if (type === "image") {

            if (
                !value ||
                value.trim() === ""
            ) {

                bg.style.background =
                    "#000000";

                return;
            }

            bg.style.background =
                "none";

            bg.style.backgroundImage =
                `url("${value.replace(
                    /"/g,
                    '\\"'
                )}")`;

            bg.style.backgroundPosition =
                "center";

            bg.style.backgroundSize =
                "cover";

            bg.style.backgroundRepeat =
                "no-repeat";

            return;
        }


        /* =====================================================
           VIDEO
           ===================================================== */

        if (type === "video") {

            if (
                !value ||
                value.trim() === ""
            ) {

                bg.style.background =
                    "#000000";

                return;
            }

            bg.style.background =
                "black";


            const video =
                document.createElement(
                    "video"
                );

            video.className =
                "background-video";

            video.src =
                value;

            video.autoplay =
                true;

            video.loop =
                true;

            video.muted =
                true;

            video.defaultMuted =
                true;

            video.playsInline =
                true;

            video.preload =
                "auto";

            video.setAttribute(
                "aria-hidden",
                "true"
            );

            bg.appendChild(
                video
            );


            video.play().catch(
                () => {}
            );


            /*
             * If the custom video doesn't load,
             * stay black.
             *
             * NEVER replace it with OMORILAB.
             */

            video.addEventListener(
                "error",
                () => {

                    video.remove();

                    bg.style.background =
                        "#000000";
                }
            );

            return;
        }


        /* =====================================================
           DEFAULT
           ===================================================== */

        /*
         * Kept for compatibility with older
         * versions of the settings page.
         *
         * This is the ONLY other place where
         * the default OMORILAB video is loaded.
         */

        if (type === "default") {

            const defaultVideo =
                "/background-imgs/OMORILAB ORIGINAL ANIMATION MEME 3333.mp4";


            const video =
                document.createElement(
                    "video"
                );

            video.className =
                "background-video";

            video.src =
                defaultVideo;

            video.autoplay =
                true;

            video.loop =
                true;

            video.muted =
                true;

            video.defaultMuted =
                true;

            video.playsInline =
                true;

            video.preload =
                "auto";

            video.setAttribute(
                "aria-hidden",
                "true"
            );

            bg.appendChild(
                video
            );

            video.play().catch(
                () => {}
            );


            video.addEventListener(
                "error",
                () => {

                    video.remove();

                    bg.style.background =
                        `linear-gradient(
                            135deg,
                            ${theme.bg1},
                            ${theme.bg2}
                        )`;
                }
            );

            return;
        }


        /*
         * Unknown type:
         * safely fall back to the theme.
         */

        bg.style.background =
            `linear-gradient(
                135deg,
                ${theme.bg1},
                ${theme.bg2}
            )`;
    }


    /* =========================================================
       FIREFLIES
       ========================================================= */

    function createStars(color) {

        document
            .querySelectorAll(".firefly")
            .forEach(
                f => f.remove()
            );


        const amount = 90;


        for (
            let i = 0;
            i < amount;
            i++
        ) {

            const firefly =
                document.createElement(
                    "div"
                );

            firefly.className =
                "firefly";


            const size =
                Math.random() * 3 + 1;

            firefly.style.width =
                size + "px";

            firefly.style.height =
                size + "px";


            firefly.style.background =
                color;


            firefly.style.left =
                Math.random() *
                window.innerWidth +
                "px";


            firefly.style.top =
                Math.random() *
                window.innerHeight +
                "px";


            const duration =
                (
                    Math.random() * 8 + 6
                ).toFixed(2);


            const startOffset =
                -(
                    Math.random() *
                    duration
                );


            firefly.style.animation =
                `fireflyMove ${duration}s linear ${startOffset}s infinite`;


            document.body.appendChild(
                firefly
            );
        }
    }


    /* =========================================================
       CLOAK SETTINGS
       ========================================================= */

    function applyCloakSettings() {

        const title =
            localStorage.getItem(
                "cloakTitle"
            );

        const icon =
            localStorage.getItem(
                "cloakIcon"
            );


        /*
         * CLOAK TITLE
         */

        if (title) {

            document.title =
                title;
        }


        /*
         * CLOAK ICON
         */

        if (icon) {

            document
                .querySelectorAll(
                    'link[rel~="icon"]'
                )
                .forEach(
                    link => link.remove()
                );


            const link =
                document.createElement(
                    "link"
                );

            link.rel =
                "icon";

            link.href =
                icon;

            document.head.appendChild(
                link
            );
        }
    }


    /* =========================================================
       APPLY EVERYTHING
       ========================================================= */

    function applySettings() {

        /*
         * Apply the SAME theme selected
         * in settings.html.
         */

        applyTheme();


        /*
         * Apply saved background.
         */

        applyBackground();


        /*
         * Apply saved tab cloak.
         */

        applyCloakSettings();


        /*
         * Firefly color.
         */

        const themeName =
            localStorage.getItem(
                "selectedTheme"
            ) || "default";

        const theme =
            themes[themeName] ||
            themes.default;


        createStars(
            theme.accent2
        );


        /*
         * Make sure body text remains
         * readable.
         */

        document.body.style.color =
            "white";
    }


    /* =========================================================
       SECRET 676767
       ========================================================= */

    let secretCode = "";


    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key.length !== 1
            ) {
                return;
            }


            secretCode +=
                event.key;


            if (
                secretCode.length > 6
            ) {

                secretCode =
                    secretCode.slice(-6);
            }


            if (
                secretCode === "676767"
            ) {

                const secret =
                    document.getElementById(
                        "secret676767"
                    );


                secret.classList.add(
                    "active"
                );


                setTimeout(
                    () => {

                        secret.classList.remove(
                            "active"
                        );

                    },
                    2000
                );


                secretCode = "";
            }
        }
    );


    /* =========================================================
       UPDATE WHEN STORAGE CHANGES
       ========================================================= */

    /*
     * This is useful if settings.html changes
     * localStorage while home.html is open
     * in another tab.
     */

    window.addEventListener(
        "storage",
        function (event) {

            if (
                event.key === "selectedTheme" ||
                event.key === "bgType" ||
                event.key === "bgValue" ||
                event.key === "activeBackground"
            ) {

                applyTheme();
                applyBackground();

                const themeName =
                    localStorage.getItem(
                        "selectedTheme"
                    ) || "default";

                const theme =
                    themes[themeName] ||
                    themes.default;

                createStars(
                    theme.accent2
                );
            }


            if (
                event.key === "cloakTitle" ||
                event.key === "cloakIcon"
            ) {

                applyCloakSettings();
            }
        }
    );


    /* =========================================================
       START
       ========================================================= */

    applySettings();


    /*
     * Always start on the home screen.
     */

    pageFrame.style.display =
        "none";

    homeOverlay.style.display =
        "flex";

    </script>

</body>

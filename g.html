<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clever</title>

    <link
        rel="icon"
        type="image/png"
        href="https://th.bing.com/th/id/ODF.cCsv-cCt-jkEcwiJYMYj4A?w=32&h=32&qlt=90&pcl=fffffc&o=6&pid=1.2"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Grandstander:ital,wght@0,100..900;1,100..900&family=Lexend:wght@100..900&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           ROOT
           SAME ACCENT SYSTEM AS HOME.HTML
           ===================================================== */

        :root {

            --accent1: #9b59b6;
            --accent2: #c084fc;

            --theme-bg1: #000000;
            --theme-bg2: #b700ff;

            --navbar-bg: rgba(20,20,20,0.7);
            --navbar-border: rgba(255,255,255,0.1);

        }


        /* =====================================================
           BODY
           ===================================================== */

        html {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Grandstander",
                cursive;

            color: white;

            overflow-x: hidden;

            background: transparent;

        }


        /* =====================================================
           BACKGROUND
           ===================================================== */

        #bg {

            position: fixed;

            inset: 0;

            z-index: -10;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    var(--theme-bg1),
                    var(--theme-bg2)
                );

        }


        #bg .background-video {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            pointer-events: none;

        }


        /* =====================================================
           FIREFLIES
           ===================================================== */

        .firefly {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            opacity: 0;

            filter: blur(0.3px);

            will-change: transform;

            animation-fill-mode: both;

            z-index: -5;

        }


        .firefly::after {

            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 50%;

            background: inherit;

            opacity: 0.25;

            filter: blur(5px);

        }


        @keyframes fireflyMove {

            0% {

                transform:
                    translate(0px, 0px)
                    scale(0.8);

                opacity: 0;

            }


            8% {

                opacity: 0.2;

            }


            15% {

                transform:
                    translate(25px, -18px)
                    scale(1);

                opacity: 0.6;

            }


            35% {

                transform:
                    translate(60px, -40px)
                    scale(0.9);

                opacity: 0.85;

            }


            55% {

                transform:
                    translate(95px, -70px)
                    scale(1.05);

                opacity: 0.55;

            }


            75% {

                transform:
                    translate(130px, -105px)
                    scale(0.95);

                opacity: 0.75;

            }


            100% {

                transform:
                    translate(170px, -145px)
                    scale(0.7);

                opacity: 0;

            }

        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .navbar {

            position: fixed;

            bottom: 15px;

            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 8px;

            padding: 8px 12px;

            border-radius: 18px;

            background:
                var(--navbar-bg);

            backdrop-filter:
                blur(12px);

            border:
                1px solid
                var(--navbar-border);

            box-shadow:

                0 0 25px
                color-mix(
                    in srgb,
                    var(--accent1) 65%,
                    transparent
                ),

                inset 0 0 10px
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            z-index: 9999;

        }


        /* =====================================================
           NAV BUTTON
           ===================================================== */

        .nav-btn {

            width: 40px;

            height: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: none;

            background: transparent;

            cursor: pointer;

            border-radius: 10px;

            transition:
                0.2s ease;

        }


        .nav-btn:hover {

            background:

                color-mix(
                    in srgb,
                    var(--accent1) 15%,
                    rgba(255,255,255,0.08)
                );

        }


        .nav-btn.active {

            background:

                linear-gradient(
                    135deg,
                    var(--accent1),
                    var(--accent2)
                );

            box-shadow:

                0 0 12px
                var(--accent1),

                0 0 20px
                var(--accent2);

        }


        .nav-btn-img {

            width: 18px;

            height: 18px;

            opacity: 0.8;

        }


        .nav-btn-game {

            width: 22px;

            height: 18px;

            opacity: 0.8;

        }


        /* =====================================================
           TITLE
           ===================================================== */

        .title {

            text-align: center;

            margin-top: 150px;

            margin-bottom: 0;

            text-shadow:

                0 0 20px
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    transparent
                );

        }


        .subtext {

            text-align: center;

            opacity: 0.45;

            margin-top: 27px;

        }


        /* =====================================================
           SEARCH
           ===================================================== */

        .searchgames {

            display: block;

            margin: 80px auto 30px;

            width: 400px;

            max-width: 90%;

            height: 40px;

            border-radius: 20px;

            border:

                2px solid
                var(--accent1);

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            backdrop-filter:
                blur(10px);

            color: inherit;

            text-align: center;

            font-family:
                "Grandstander",
                cursive;

            font-size: 14px;

            outline: none;

            transition:
                0.2s ease;

        }


        .searchgames:focus,
        .searchgames:hover {

            box-shadow:

                0 0 10px
                var(--accent1),

                0 0 20px
                color-mix(
                    in srgb,
                    var(--accent2) 30%,
                    transparent
                );

            background:

                color-mix(
                    in srgb,
                    var(--accent1) 10%,
                    rgba(255,255,255,0.05)
                );

        }


        /* =====================================================
           GAME PANEL
           ===================================================== */

        .game-panel {

            margin:
                100px auto 40px;

            max-width: 900px;

            padding:
                20px;

            text-align: center;

            border-radius: 20px;

            backdrop-filter:
                blur(15px);

            background:
                rgba(0,0,0,0.05);

        }


        /* =====================================================
           GAME GRID
           ===================================================== */

        .game-grid {

            display: grid;

            grid-template-columns:
                repeat(8, 1fr);

            gap: 15px;

            padding: 20px;

            max-width: 1200px;

            margin: auto;

        }


        /* =====================================================
           GAME CARD
           ===================================================== */

        .game {

            width: 120px;

            height: 120px;

            border-radius: 15px;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            overflow: hidden;

            position: relative;

            transition:
                0.2s ease;

            color: transparent;

        }


        .game:hover {

            transform:
                scale(1.1);

            background:

                color-mix(
                    in srgb,
                    var(--accent1) 15%,
                    rgba(0,0,0,0.2)
                );

            box-shadow:

                0 0 15px
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    transparent
                );

        }


        .game img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 10px;

            pointer-events: none;

            transition:
                0.2s ease;

        }


        .game:hover img {

            filter:
                brightness(0.6);

            transform:
                scale(1.05);

        }


        .game::after {

            content:
                attr(data-name);

            position: absolute;

            bottom: 8px;

            left: 50%;

            transform:
                translateX(-50%)
                scale(0.75);

            font-size: 12px;

            font-weight: 500;

            color: white;

            text-align: center;

            opacity: 0;

            transition:
                0.2s ease;

        }


        .game:hover::after {

            opacity: 1;

            transform:
                translateX(-50%)
                scale(0.9);

        }


        /* =====================================================
           GAME NUMBER
           ===================================================== */

        .game-number {

            color:
                var(--accent1);

            font-weight: bold;

        }


        /* =====================================================
           ZONE VIEWER
           ===================================================== */

        #zoneViewer {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.95);

            flex-direction: column;

            align-items: center;

            justify-content: center;

            z-index: 99999;

            padding: 10px;

        }


        #zoneNameDisplay {

            font-size: 2em;

            font-weight: 700;

            text-align: center;

            margin-bottom: 15px;

        }


        #zoneFrame {

            width: 90%;

            height: 70%;

            max-width: 1600px;

            max-height: 90%;

            border-radius: 12px;

            border:

                2px solid
                color-mix(
                    in srgb,
                    var(--accent1) 40%,
                    rgba(255,255,255,0.2)
                );

            box-shadow:

                0 0 20px
                color-mix(
                    in srgb,
                    var(--accent1) 40%,
                    transparent
                );

            margin-bottom: 10px;

        }


        #zoneViewer .buttons {

            display: flex;

            gap: 10px;

        }


        #zoneViewer button {

            padding:
                10px 18px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            background:

                color-mix(
                    in srgb,
                    var(--accent1) 20%,
                    rgba(255,255,255,0.1)
                );

            color: white;

        }


        #zoneViewer button:hover {

            background:

                color-mix(
                    in srgb,
                    var(--accent1) 40%,
                    rgba(255,255,255,0.1)
                );

        }


        /* =====================================================
           LOADING
           ===================================================== */

        #loadingScreen {

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    #111,
                    #000
                );

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 99999;

            transition:
                opacity 0.4s ease;

        }


        .loader-box {

            text-align: center;

            color: white;

        }


        .spinner {

            width: 60px;

            height: 60px;

            border:

                4px solid
                rgba(255,255,255,0.1);

            border-top:

                4px solid
                var(--accent1);

            border-radius: 50%;

            animation:
                spin 1s linear infinite;

            margin:
                25px auto 15px;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        .loading-text {

            font-size: 28px;

            font-weight: bold;

        }


        #loadingMessage {

            text-align: center;

            font-size: 28px;

            opacity: 0.7;

            font-family:
                "Grandstander",
                cursive;

            margin-bottom: 25px;

        }


        /* =====================================================
           SCROLLBAR
           EXACT ACCENT COLOR
           ===================================================== */

        ::-webkit-scrollbar {

            width: 10px;

        }


        ::-webkit-scrollbar-track {

            background:
                rgba(0,0,0,0.7);

        }


        ::-webkit-scrollbar-thumb {

            background:
                var(--accent1);

            border-radius: 10px;

            border:

                2px solid
                rgba(0,0,0,0.4);

        }


        ::-webkit-scrollbar-thumb:hover {

            background:
                var(--accent2);

        }


        /* Firefox */

        * {

            scrollbar-width:
                thin;

            scrollbar-color:

                var(--accent1)
                rgba(0,0,0,0.7);

        }


        /* =====================================================
           PRIVACY OVERLAY
           ===================================================== */

        #inactiveOverlay {

            position: fixed;

            inset: 0;

            background: #000;

            z-index: 999999999;

            display: none;

            pointer-events: none;

        }


        #inactiveOverlay.active {

            display: block;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 900px) {

            .game-grid {

                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(120px, 1fr)
                    );

            }

        }


        @media (max-width: 600px) {

            .title {

                margin-top: 100px;

            }


            .game-grid {

                grid-template-columns:
                    repeat(2, 1fr);

                justify-items: center;

            }

        }
/* =========================
   DARK BACKGROUND OVERLAY
========================= */

#bg::after {
    content: "";
    position: absolute;
    inset: 0;

    background: rgba(0, 0, 0, 0.214);

    pointer-events: none;
    z-index: 1;
}

/* Keep videos behind the dark overlay */
.background-video {
    z-index: 0 !important;
}

/* Content stays above everything */
.page {
    z-index: 3 !important;
}

#starContainer {
    z-index: 2 !important;
}
    </style>

</head>


<body>

    <div id="bg"></div>

    <!-- =====================================================
         THEME SYSTEM
         SAME AS HOME.HTML
         ===================================================== -->

    <script>

        const themes = {

            default: {

                accent1: "#9b59b6",
                accent2: "#c084fc",

                bg1: "#000000",
                bg2: "#b700ff"

            },


            girly: {

                accent1: "#ff69b4",
                accent2: "#ffb6d9",

                bg1: "#3a001f",
                bg2: "#ff69b4"

            },


            hacker: {

                accent1: "#00ff55",
                accent2: "#00cc44",

                bg1: "#000800",
                bg2: "#003b15"

            },


            ocean: {

                accent1: "#00aaff",
                accent2: "#66ddff",

                bg1: "#00101f",
                bg2: "#0066aa"

            },


            forest: {

                accent1: "#35c759",
                accent2: "#8bdc8b",

                bg1: "#031007",
                bg2: "#176b2c"

            },


            sunset: {

                accent1: "#ff512f",
                accent2: "#dd2476",

                bg1: "#200000",
                bg2: "#ff512f"

            },


            purple: {

                accent1: "#b026ff",
                accent2: "#d580ff",

                bg1: "#100020",
                bg2: "#6a00a8"

            },


            cyber: {

                accent1: "#ff00cc",
                accent2: "#3333ff",

                bg1: "#08000f",
                bg2: "#330066"

            },


            red: {

                accent1: "#ff2020",
                accent2: "#ff6666",

                bg1: "#120000",
                bg2: "#8b0000"

            },


            midnight: {

                accent1: "#4d6cff",
                accent2: "#7289ff",

                bg1: "#020024",
                bg2: "#090979"

            },


            ice: {

                accent1: "#66e6ff",
                accent2: "#b8f5ff",

                bg1: "#00151c",
                bg2: "#006b7a"

            },


            gold: {

                accent1: "#ffd700",
                accent2: "#fff09a",

                bg1: "#160e00",
                bg2: "#806000"

            },


            cherry: {

                accent1: "#ff1744",
                accent2: "#ff6685",

                bg1: "#180006",
                bg2: "#8b001c"

            },


            lavender: {

                accent1: "#c77dff",
                accent2: "#e0aaff",

                bg1: "#100818",
                bg2: "#5a189a"

            },


            neon: {

                accent1: "#00ffea",
                accent2: "#ff00ff",

                bg1: "#000b12",
                bg2: "#260026"

            },


            coffee: {

                accent1: "#d2691e",
                accent2: "#f4a460",

                bg1: "#100804",
                bg2: "#5c2e0e"

            },


            emerald: {

                accent1: "#00c878",
                accent2: "#63ffb5",

                bg1: "#00140e",
                bg2: "#006b43"

            }

        };


        /* =====================================================
           APPLY THEME
           ===================================================== */

        function applyTheme() {

            let themeName =
                localStorage.getItem(
                    "selectedTheme"
                );


            if (
                !themeName ||
                !themes[themeName]
            ) {

                themeName =
                    "default";

            }


            const theme =
                themes[themeName];


            document.documentElement.style.setProperty(
                "--accent1",
                theme.accent1
            );


            document.documentElement.style.setProperty(
                "--accent2",
                theme.accent2
            );


            document.documentElement.style.setProperty(
                "--theme-bg1",
                theme.bg1
            );


            document.documentElement.style.setProperty(
                "--theme-bg2",
                theme.bg2
            );


            createFireflies(
                theme.accent2
            );

        }


        /* =====================================================
           BACKGROUND SYSTEM
           SAME AS HOME.HTML
           ===================================================== */

        function applyBackground() {

            const bg =
                document.getElementById(
                    "bg"
                );


            if (!bg) return;


            let type =
                localStorage.getItem(
                    "bgType"
                );


            let value =
                localStorage.getItem(
                    "bgValue"
                );


            let themeName =
                localStorage.getItem(
                    "selectedTheme"
                );


            if (
                !themeName ||
                !themes[themeName]
            ) {

                themeName =
                    "default";

            }


            const theme =
                themes[themeName];


            /* Remove old video */

            const oldVideo =
                bg.querySelector(
                    ".background-video"
                );


            if (oldVideo) {

                oldVideo.pause();

                oldVideo.remove();

            }


            bg.style.backgroundImage =
                "none";


            bg.style.background =
                "transparent";


            /* NONE */

            if (
                !type ||
                type === "none"
            ) {

                bg.style.background =

                    `linear-gradient(
                        135deg,
                        ${theme.bg1},
                        ${theme.bg2}
                    )`;

                return;

            }


            /* COLOR */

            if (
                type === "color"
            ) {

                bg.style.background =
                    value || "#000";

                return;

            }


            /* IMAGE */

            if (
                type === "image"
            ) {

                bg.style.backgroundImage =

                    `url("${value}")`;


                bg.style.backgroundPosition =
                    "center";


                bg.style.backgroundSize =
                    "cover";


                bg.style.backgroundRepeat =
                    "no-repeat";

                return;

            }


            /* VIDEO */

            if (
                type === "video"
            ) {

                const video =
                    document.createElement(
                        "video"
                    );


                video.className =
                    "background-video";


                video.src =
                    value;


                video.autoplay =
                    true;


                video.loop =
                    true;


                video.muted =
                    true;


                video.defaultMuted =
                    true;


                video.playsInline =
                    true;


                video.preload =
                    "auto";


                bg.appendChild(
                    video
                );


                video.play().catch(
                    () => {}
                );


                video.addEventListener(
                    "error",
                    () => {

                        video.remove();


                        bg.style.background =

                            `linear-gradient(
                                135deg,
                                ${theme.bg1},
                                ${theme.bg2}
                            )`;

                    }
                );


                return;

            }


            /* FALLBACK */

            bg.style.background =

                `linear-gradient(
                    135deg,
                    ${theme.bg1},
                    ${theme.bg2}
                )`;

        }


        /* =====================================================
           FIREFLIES
           ===================================================== */

        function createFireflies(color) {

            document
                .querySelectorAll(
                    ".firefly"
                )
                .forEach(
                    firefly =>
                        firefly.remove()
                );


            const amount =
                90;


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const firefly =
                    document.createElement(
                        "div"
                    );


                firefly.className =
                    "firefly";


                const size =
                    Math.random() * 3 + 1;


                firefly.style.width =
                    size + "px";


                firefly.style.height =
                    size + "px";


                firefly.style.background =
                    color;


                firefly.style.left =

                    Math.random() *
                    window.innerWidth +
                    "px";


                firefly.style.top =

                    Math.random() *
                    window.innerHeight +
                    "px";


                const duration =

                    (
                        Math.random() * 8 + 6
                    ).toFixed(2);


                const startOffset =

                    -(
                        Math.random() *
                        duration
                    );


                firefly.style.animation =

                    `fireflyMove
                    ${duration}s
                    linear
                    ${startOffset}s
                    infinite`;


                document.body.appendChild(
                    firefly
                );

            }

        }


        /* =====================================================
           CLOAK
           ===================================================== */

        function applyCloakSettings() {

            const title =
                localStorage.getItem(
                    "cloakTitle"
                );


            const icon =
                localStorage.getItem(
                    "cloakIcon"
                );


            if (title) {

                document.title =
                    title;

            }


            if (icon) {

                document
                    .querySelectorAll(
                        'link[rel~="icon"]'
                    )
                    .forEach(
                        link =>
                            link.remove()
                    );


                const link =
                    document.createElement(
                        "link"
                    );


                link.rel =
                    "icon";


                link.href =
                    icon;


                document.head.appendChild(
                    link
                );

            }

        }


        /* =====================================================
           APPLY EVERYTHING
           ===================================================== */

        function applySettings() {

            applyTheme();

            applyBackground();

            applyCloakSettings();

        }


        /* =====================================================
           STORAGE UPDATES
           ===================================================== */

        window.addEventListener(
            "storage",
            function(event) {

                if (

                    event.key ===
                    "selectedTheme"

                ) {

                    applyTheme();

                    applyBackground();

                }


                if (

                    event.key ===
                    "bgType" ||

                    event.key ===
                    "bgValue"

                ) {

                    applyBackground();

                }


                if (

                    event.key ===
                    "cloakTitle" ||

                    event.key ===
                    "cloakIcon"

                ) {

                    applyCloakSettings();

                }

            }
        );


        /* =====================================================
           START
           ===================================================== */

        window.addEventListener(
            "DOMContentLoaded",
            applySettings
        );

    </script>


    <!-- =====================================================
         INACTIVE TAB OVERLAY
         ===================================================== -->

    <script>

        const inactiveOverlay =
            document.getElementById(
                "inactiveOverlay"
            );


        function updateInactiveOverlay() {

            if (
                document.hidden
            ) {

                inactiveOverlay.classList.add(
                    "active"
                );

            }

            else {

                inactiveOverlay.classList.remove(
                    "active"
                );

            }

        }


        document.addEventListener(
            "visibilitychange",
            updateInactiveOverlay
        );


        window.addEventListener(
            "blur",
            () => {

                inactiveOverlay.classList.add(
                    "active"
                );

            }
        );


        window.addEventListener(
            "focus",
            () => {

                if (
                    !document.hidden
                ) {

                    inactiveOverlay.classList.remove(
                        "active"
                    );

                }

            }
        );


        updateInactiveOverlay();

    </script>


</body>

<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="100%"
     viewBox="0 0 1200 800">

  <foreignObject width="1200" height="800">

    <html xmlns="http://www.w3.org/1999/xhtml">

      <head>
        <meta charset="UTF-8" />

        <style><![CDATA[

          * {
            box-sizing: border-box;
          }

          html,
          body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
          }

          body {
            background: #f7f7f8;
            color: #222;
          }

          nav {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
          }

          .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1.5px;
          }

          .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
          }

          .nav-links a {
            text-decoration: none;
            color: #555;
            font-size: 15px;
          }

          .nav-links a:hover {
            color: #000;
          }

          .get-started {
            background: #222;
            color: white !important;

            padding: 10px 17px;
            border-radius: 8px;
          }

          .hero {
            min-height: 500px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 80px 20px;
          }

          .hero-content {
            max-width: 850px;
          }

          .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            background: white;
            border: 1px solid #e2e2e2;

            border-radius: 30px;

            padding: 9px 15px;

            font-size: 14px;

            margin-bottom: 24px;
          }

          .badge svg {
            width: 17px;
            height: 17px;
          }

          h1 {
            font-size: 72px;

            line-height: 1.05;

            letter-spacing: -4px;

            margin: 0;
          }

          .hero p {
            max-width: 620px;

            margin: 25px auto;

            color: #666;

            font-size: 18px;

            line-height: 1.6;
          }

          .buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 32px;
          }

          button {
            border: none;
            cursor: pointer;

            font-size: 16px;
            font-weight: 600;

            padding: 14px 23px;

            border-radius: 9px;
          }

          .primary {
            background: #222;
            color: white;
          }

          .secondary {
            background: white;
            color: #222;

            border: 1px solid #ddd;
          }

          .primary:hover {
            background: #000;
          }

          .secondary:hover {
            background: #f1f1f1;
          }

          .features {
            max-width: 1100px;

            margin: auto;

            padding: 20px 30px 100px;

            display: grid;

            grid-template-columns:
              repeat(3, 1fr);

            gap: 20px;
          }

          .card {
            background: white;

            border: 1px solid #e5e5e5;

            border-radius: 14px;

            padding: 30px;

            transition: transform .2s ease;
          }

          .card:hover {
            transform: translateY(-5px);
          }

          .icon-box {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #f3f3f4;

            border-radius: 12px;

            margin-bottom: 18px;
          }

          .icon-box svg {
            width: 25px;
            height: 25px;
          }

          .card h2 {
            margin: 0 0 10px;

            font-size: 21px;
          }

          .card p {
            margin: 0;

            color: #666;

            line-height: 1.6;
          }

          .bottom {
            background: white;

            border-top: 1px solid #e5e5e5;

            padding: 70px 30px;

            text-align: center;
          }

          .bottom h2 {
            font-size: 38px;

            letter-spacing: -1.5px;

            margin: 0 0 15px;
          }

          .bottom p {
            color: #666;

            max-width: 600px;

            margin: auto;
          }

          footer {
            background: #222;

            color: #aaa;

            text-align: center;

            padding: 30px;

            font-size: 14px;
          }

          @media (max-width: 750px) {

            nav {
              padding: 0 20px;
            }

            .nav-links a:not(.get-started) {
              display: none;
            }

            h1 {
              font-size: 50px;
              letter-spacing: -2px;
            }

            .features {
              grid-template-columns: 1fr;
            }

            .buttons {
              flex-direction: column;
              align-items: center;
            }

            button {
              width: 220px;
            }

          }

        ]]></style>

      </head>


      <body>

        <nav>

          <div class="logo">
            Learnly
          </div>


          <div class="nav-links">

            <a href="#" onclick="goTo('flashcards.html')">
              Flashcards
            </a>

            <a href="#" onclick="goTo('quizzes.html')">
              Quizzes
            </a>

            <a href="#" onclick="goTo('progress.html')">
              Progress
            </a>

            <a href="#" onclick="goTo('login.html')">
              Log in
            </a>

            <a href="#" class="get-started"
               onclick="goTo('signup.html')">
              Get started
            </a>

          </div>

        </nav>


        <main>

          <section class="hero">

            <div class="hero-content">

              <div class="badge">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                  <circle cx="12" cy="12" r="9"/>
                  <path d="M8 12l2.5 2.5L16 9"/>

                </svg>

                Learn your way

              </div>


              <h1>

                Learn smarter.<br/>

                Remember more.

              </h1>


              <p>

                Create flashcards, practice quizzes,
                and keep track of what you're learning.

                Learnly gives you simple tools to help
                you study any subject.

              </p>


              <div class="buttons">

                <button class="primary"
                        onclick="goTo('flashcards.html')">

                  Start studying

                </button>


                <button class="secondary"
                        onclick="goTo('quizzes.html')">

                  Take a quiz

                </button>

              </div>

            </div>

          </section>



          <section class="features">


            <div class="card">

              <div class="icon-box">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                  <rect x="4"
                        y="5"
                        width="16"
                        height="14"
                        rx="2"/>

                  <path d="M8 9h8"/>

                  <path d="M8 13h5"/>

                </svg>

              </div>


              <h2>

                Flashcards

              </h2>


              <p>

                Enter any topic and create study
                flashcards to help you review
                important information.

              </p>

            </div>



            <div class="card">

              <div class="icon-box">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                  <path d="M9 11l3 3L22 4"/>

                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>

                </svg>

              </div>


              <h2>

                Quizzes

              </h2>


              <p>

                Test what you know with questions
                and practice the topics you need
                to remember.

              </p>

            </div>



            <div class="card">

              <div class="icon-box">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                  <path d="M3 3v18h18"/>

                  <path d="M7 16l4-5 3 3 5-7"/>

                </svg>

              </div>


              <h2>

                Progress

              </h2>


              <p>

                Keep track of your study activity
                and see how you're improving
                over time.

              </p>

            </div>


          </section>



          <section class="bottom">

            <h2>

              Everything you need to learn.

            </h2>


            <p>

              Study for school, prepare for tests,
              or learn something completely new.
              Learnly keeps your learning tools
              in one simple place.

            </p>

          </section>

        </main>


        <footer>

          © 2026 Learnly · Learn your way

        </footer>



        <script><![CDATA[

          function goTo(page) {

            window.location.href = page;

          }

        ]]></script>


      </body>

    </html>

  </foreignObject>

</svg>
